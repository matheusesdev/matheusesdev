<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 236" width="1000" height="236" role="img" aria-label="Stack">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.ink{fill:#f0f6fc}.mute{fill:#9198a1}.ghost{fill:#f0f6fc}
.rule{stroke:#3d444d;stroke-width:1;fill:none}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left bottom;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) both}
.up{transform-box:fill-box;transform-origin:bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.rise,.grow,.up,.ring{animation:none}}
</style>
<path class="rule draw" d="M172 10L172 224" pathLength="1"/><g class="rise" style="animation-delay:0.00s"><text x="48" y="32" font-size="11" class="mute" letter-spacing="2">LINGUAGENS</text><text x="196" y="32" font-size="14" class="ink" >TypeScript · JavaScript · Python</text></g><g class="rise" style="animation-delay:0.15s"><text x="48" y="62" font-size="11" class="mute" letter-spacing="2">WEB</text><text x="196" y="62" font-size="14" class="ink" >React · Next.js · React Native · Tailwind CSS</text></g><g class="rise" style="animation-delay:0.30s"><text x="48" y="92" font-size="11" class="mute" letter-spacing="2">BACKEND</text><text x="196" y="92" font-size="14" class="ink" >FastAPI · APIs REST · Webhooks</text></g><g class="rise" style="animation-delay:0.45s"><text x="48" y="122" font-size="11" class="mute" letter-spacing="2">DADOS</text><text x="196" y="122" font-size="14" class="ink" >PostgreSQL · Prisma · Supabase · Jupyter · scikit-learn</text></g><g class="rise" style="animation-delay:0.60s"><text x="48" y="152" font-size="11" class="mute" letter-spacing="2">IA</text><text x="196" y="152" font-size="14" class="ink" >Claude · OpenAI · Gemini · MCP</text></g><g class="rise" style="animation-delay:0.75s"><text x="48" y="182" font-size="11" class="mute" letter-spacing="2">AUTOMAÇÃO</text><text x="196" y="182" font-size="14" class="ink" >n8n · GitHub Actions · Fluxos de CRM</text></g><g class="rise" style="animation-delay:0.90s"><text x="48" y="212" font-size="11" class="mute" letter-spacing="2">DEPLOY</text><text x="196" y="212" font-size="14" class="ink" >Docker · Vercel · Railway</text></g>
</svg>
