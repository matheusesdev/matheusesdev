<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 228" width="1000" height="228" role="img" aria-label="whoami">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.ink{fill:#f0f6fc}.mute{fill:#9198a1}.ghost{fill:#f0f6fc}
.rule{stroke:#3d444d;stroke-width:1;fill:none}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left bottom;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) both}
.up{transform-box:fill-box;transform-origin:bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.rise,.grow,.up,.ring{animation:none}}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="48" y="28" font-size="15" class="ink" >Information Systems undergraduate. CRM Systems Analyst.</text></g><g class="rise" style="animation-delay:0.15s"><text x="48" y="58" font-size="15" class="ink" >Working between business processes and software: CRM, APIs, data and automation.</text></g><g class="rise" style="animation-delay:0.30s"><text x="48" y="88" font-size="15" class="mute" >I start from the real problem and pick the simplest solution that works reliably.</text></g><path class="rule draw" d="M48 112L952 112" pathLength="1"/><g class="rise" style="animation-delay:0.45s"><text x="48" y="146" font-size="11" class="mute" letter-spacing="2">FOCUS ▸</text><text x="170" y="146" font-size="13" class="ink" >CRM systems · Integrations · Data analysis · AI automation</text></g><g class="rise" style="animation-delay:0.60s"><text x="48" y="176" font-size="11" class="mute" letter-spacing="2">METHOD ▸</text><text x="170" y="176" font-size="13" class="ink" >Understand · Build the simplest reliable thing · Improve with data</text></g><g class="rise" style="animation-delay:0.75s"><text x="48" y="206" font-size="11" class="mute" letter-spacing="2">BASED IN ▸</text><text x="170" y="206" font-size="13" class="ink" >Vitória da Conquista, Bahia, Brazil</text></g>
</svg>
