<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 228" width="1000" height="228" role="img" aria-label="whoami">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.ink{fill:#1f2328}.mute{fill:#59636e}.ghost{fill:#1f2328}
.rule{stroke:#d1d9e0;stroke-width:1;fill:none}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left bottom;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) both}
.up{transform-box:fill-box;transform-origin:bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.rise,.grow,.up,.ring{animation:none}}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="48" y="28" font-size="15" class="ink" >Graduando em Sistemas de Informação. Analista de Sistemas CRM.</text></g><g class="rise" style="animation-delay:0.15s"><text x="48" y="58" font-size="15" class="ink" >Atuo entre processos de negócio e software: CRM, APIs, dados e automação.</text></g><g class="rise" style="animation-delay:0.30s"><text x="48" y="88" font-size="15" class="mute" >Começo pelo problema real e escolho a solução mais simples que funcione bem.</text></g><path class="rule draw" d="M48 112L952 112" pathLength="1"/><g class="rise" style="animation-delay:0.45s"><text x="48" y="146" font-size="11" class="mute" letter-spacing="2">FOCO ▸</text><text x="170" y="146" font-size="13" class="ink" >Sistemas CRM · Integrações · Análise de dados · Automação com IA</text></g><g class="rise" style="animation-delay:0.60s"><text x="48" y="176" font-size="11" class="mute" letter-spacing="2">MÉTODO ▸</text><text x="170" y="176" font-size="13" class="ink" >Entender · Construir o simples e confiável · Melhorar com dados</text></g><g class="rise" style="animation-delay:0.75s"><text x="48" y="206" font-size="11" class="mute" letter-spacing="2">BASE ▸</text><text x="170" y="206" font-size="13" class="ink" >Vitória da Conquista, Bahia, Brasil</text></g>
</svg>
