<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Route">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.ink{fill:#1f2328}.mute{fill:#59636e}.ghost{fill:#1f2328}
.rule{stroke:#d1d9e0;stroke-width:1;fill:none}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left bottom;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) both}
.up{transform-box:fill-box;transform-origin:bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.rise,.grow,.up,.ring{animation:none}}
</style>
<text x="48" y="24" font-size="11" class="mute" letter-spacing="2">A ROTA ATÉ AQUI</text><path class="rule draw" d="M48 100L952 100" pathLength="1"/><g class="rise" style="animation-delay:0.30s"><circle class="ink" cx="120" cy="100" r="4"/><path class="rule" d="M120 82L120 96" pathLength="1"/><text x="120" y="58" font-size="12" class="ink" text-anchor="middle">2023-09</text><text x="120" y="76" font-size="11" class="mute" text-anchor="middle">entrada no GitHub</text></g><g class="rise" style="animation-delay:0.45s"><circle class="ink" cx="373" cy="100" r="4"/><path class="rule" d="M373 104L373 120" pathLength="1"/><text x="373" y="134" font-size="12" class="ink" text-anchor="middle">2026-08</text><text x="373" y="152" font-size="11" class="mute" text-anchor="middle">Matchly</text></g><g class="rise" style="animation-delay:0.60s"><circle class="ink" cx="627" cy="100" r="4"/><path class="rule" d="M627 82L627 96" pathLength="1"/><text x="627" y="58" font-size="12" class="ink" text-anchor="middle">2026-08</text><text x="627" y="76" font-size="11" class="mute" text-anchor="middle">MecaniQA</text></g><g class="rise" style="animation-delay:0.75s"><circle class="ring" cx="880" cy="100" r="6" fill="none" stroke="#1f2328"/><circle class="ink" cx="880" cy="100" r="4"/><path class="rule" d="M880 104L880 120" pathLength="1"/><text x="880" y="134" font-size="12" class="ink" text-anchor="middle">AGORA</text><text x="880" y="152" font-size="11" class="mute" text-anchor="middle">construindo</text></g>
</svg>
