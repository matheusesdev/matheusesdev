<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-label="Matheus Santos">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.ink{fill:#1f2328}.mute{fill:#59636e}.ghost{fill:#1f2328}
.rule{stroke:#d1d9e0;stroke-width:1;fill:none}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-box:fill-box;transform-origin:left bottom;animation:growx 1.1s cubic-bezier(.2,.7,.2,1) both}
.up{transform-box:fill-box;transform-origin:bottom;animation:growy 1.1s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.draw,.rise,.grow,.up,.ring{animation:none}}
</style>
<g class="rise" style="animation-delay:0.00s"><text x="48" y="30" font-size="11" class="mute" letter-spacing="2">PORTFÓLIO — ÍNDICE Nº 001</text><text x="952" y="30" font-size="11" class="mute" letter-spacing="2" text-anchor="end">VITÓRIA DA CONQUISTA, BR — 14,86° S &amp; 40,84° O</text></g><path class="rule draw" d="M48 44L952 44" pathLength="1"/><g class="rise" style="animation-delay:0.15s"><text x="45" y="140" font-size="58" class="ink" >Matheus Santos</text></g><g class="rise" style="animation-delay:0.30s"><text x="48" y="178" font-size="17" class="ink" >Analista de Sistemas CRM, Dados e IA — Bahia, Brasil.</text></g><g class="rise" style="animation-delay:0.45s"><text x="48" y="226" font-size="13" class="mute" >Foco ▸</text><text x="130" y="226" font-size="13" class="ink" >Fluxos de CRM · Integrações via API · Análise de dados · Automação com IA</text></g><path class="rule draw" d="M48 262L952 262" pathLength="1"/><g class="rise" style="animation-delay:0.60s"><text x="48" y="292" font-size="11" class="mute" letter-spacing="2">SISTEMAS CRM</text><text x="278" y="292" font-size="11" class="mute" letter-spacing="2">INTEGRAÇÕES</text><text x="508" y="292" font-size="11" class="mute" letter-spacing="2">DADOS &amp; IA</text><text x="952" y="292" font-size="11" class="mute" letter-spacing="2" text-anchor="end">SISTEMAS DE INFORMAÇÃO</text></g>
</svg>
